name: Checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.10'
          - os: macos-latest
            python: '3.13'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Python data, protocol and relocation tests
        run: python3 -m unittest discover -s tests -v
      - name: Frontend syntax
        run: |
          node --check src/project_pulse/web/app.js
          node --check src/project_pulse/web/components.js
          node --check src/project_pulse/web/brand.js
          node --check src/project_pulse/web/mcp-bridge.js
      - name: Frontend state and bridge tests
        run: node --test tests/*.test.cjs
